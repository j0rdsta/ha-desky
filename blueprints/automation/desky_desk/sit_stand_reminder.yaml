blueprint:
  name: Desky - Sit/stand reminder
  description: >-
    Sends a notification when you have been sitting at the desk for longer than a
    set time. The desk counts as sitting once it stops below the standing threshold
    set in the Desky options. Time while the desk is unavailable does not count, so
    the timer starts again when the desk comes back.


    To remind you at any time of day, leave the start and end times the same.
  domain: automation
  author: Jordan Gardiner
  source_url: https://github.com/j0rdsta/ha-desky/blob/main/blueprints/automation/desky_desk/sit_stand_reminder.yaml
  homeassistant:
    min_version: 2025.10.0
  input:
    posture_sensor:
      name: Posture sensor
      description: The desk's Posture sensor.
      selector:
        entity:
          filter:
            - integration: desky_desk
              domain: sensor
              device_class: enum
    sitting_minutes:
      name: Sitting time
      description: Minutes of sitting before the reminder is sent.
      default: 60
      selector:
        number:
          min: 5
          max: 480
          step: 5
          unit_of_measurement: min
          mode: box
    notify_action:
      name: Notification action
      description: >-
        The action that sends the reminder, for example
        notify.mobile_app_your_phone. It is called with a title and a message.
      default: persistent_notification.create
      selector:
        text:
    start_time:
      name: Start time
      description: Reminders are sent from this time.
      default: "00:00:00"
      selector:
        time:
    end_time:
      name: End time
      description: Reminders are sent until this time.
      default: "00:00:00"
      selector:
        time:
    weekdays:
      name: Weekdays
      description: Reminders are sent on these days.
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          multiple: true
          mode: list
          options:
            - label: Monday
              value: mon
            - label: Tuesday
              value: tue
            - label: Wednesday
              value: wed
            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun

mode: single
max_exceeded: silent

variables:
  sitting_minutes: !input sitting_minutes

triggers:
  - trigger: state
    entity_id: !input posture_sensor
    to: sitting
    for:
      minutes: !input sitting_minutes

conditions:
  - condition: time
    after: !input start_time
    before: !input end_time
    weekday: !input weekdays

actions:
  - action: !input notify_action
    data:
      title: Time to stand up
      message: You have been sitting for {{ sitting_minutes }} minutes.
