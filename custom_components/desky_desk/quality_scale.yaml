rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: |
      Heights and settings arrive as notifications. The 30-second status
      request keeps a quiet desk's state fresh and finds a connection that
      dropped without a disconnect event.
  brands:
    status: todo
    comment: The integration's own brand icon is pending.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The desk is reached over Bluetooth without credentials.
  test-coverage: done

  # Gold
  devices: todo
  diagnostics: done
  discovery: todo
  discovery-update-info:
    status: exempt
    comment: The desk's Bluetooth address is stable, so there is nothing to update.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Each config entry is a single desk.
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: Each config entry is a single desk, removed with its entry.

  # Platinum
  async-dependency: todo
  inject-websession:
    status: exempt
    comment: The integration makes no HTTP requests.
  strict-typing: todo
