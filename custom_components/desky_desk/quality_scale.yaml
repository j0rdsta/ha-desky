rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: |
      Heights and settings arrive as notifications. A status request 30
      seconds after the last update keeps a quiet desk's state fresh and
      finds a connection that dropped without a disconnect event.
  brands:
    status: done
    comment: The integration ships its own icons in brand/ (Home Assistant 2026.3+).
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The desk is reached over Bluetooth without credentials.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info:
    status: exempt
    comment: |
      Bluetooth only, no IP discovery. The address is the unique ID and the
      only stored data, and each advertisement refreshes the BLEDevice.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Each config entry is a single desk.
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: Each config entry is a single desk, removed with its entry.

  # Platinum
  async-dependency: todo
  inject-websession:
    status: exempt
    comment: The integration makes no HTTP requests.
  strict-typing: todo
