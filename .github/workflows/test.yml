name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # tokenless Codecov upload
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2025.10"
            python: "3.13"
            requirements: requirements_test_min.txt
          - ha: latest
            python: "3.14"
            requirements: requirements_test.txt
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Install dependencies
        run: |
          uv pip install -r ${{ matrix.requirements }}
          uv pip install -r <(python script/ha_test_requirements.py)
      - name: Run tests
        run: pytest --cov --cov-report=xml --cov-report=term
      - name: Upload coverage
        if: matrix.ha == 'latest'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: false

  beta:
    name: Test (HA beta)
    runs-on: ubuntu-latest
    # Reports upcoming breakage without blocking merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
          activate-environment: true
      - name: Install dependencies
        run: |
          uv pip install -r requirements_dev.txt pytest-homeassistant-custom-component
          uv pip install -r <(python script/ha_test_requirements.py)
          python -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"
      - name: Run tests
        run: pytest
