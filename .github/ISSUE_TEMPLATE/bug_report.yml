name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. The details below let us reproduce it without
        access to your desk.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Settings > About.
      placeholder: "2026.9.4"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: HACS > Desky Standing Desk, or `version` in `manifest.json`.
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: desk_model
    attributes:
      label: Desk model and controller
      description: As shown on the device page under Settings > Devices & services.
  - type: dropdown
    id: connection
    attributes:
      label: Bluetooth connection
      options:
        - Local adapter on the Home Assistant host
        - ESPHome Bluetooth proxy
        - Not sure
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Download diagnostics and attach the file here: go to Settings > Devices & services >
        Desky Standing Desk, open the three dots menu on the desk's entry and select
        "Download diagnostics". This works whether or not the desk is connected. The Bluetooth
        address and serial number are redacted, but please check the file before posting. See
        https://j0rdsta.github.io/ha-desky/troubleshooting/#download-diagnostics
  - type: textarea
    id: logs
    attributes:
      label: Debug logs
      description: |
        Enable debug logging for `custom_components.desky_desk` (see
        https://j0rdsta.github.io/ha-desky/troubleshooting/#debug-logging), reproduce
        the problem, then paste the relevant lines. Look for `Received notification:` entries.
      render: text
